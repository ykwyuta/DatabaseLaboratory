name: Database verification
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      extra_database:
        description: Additional resource-intensive database
        type: choice
        default: none
        options: [none, oracle, db2, alloydb]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/generate.py
      - run: git diff --exit-code
      - run: python -m unittest discover -s tests -v
      - run: docker compose --profile '*' config --quiet
  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, mysql, mariadb, sqlserver, mongo, redis, clickhouse, spanner]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/dblab.py up ${{ matrix.database }}
      - run: python tools/dblab.py verify ${{ matrix.database }}
      - if: always()
        run: python tools/dblab.py logs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.database }}
          path: reports/
          if-no-files-found: ignore
      - if: always()
        run: python tools/dblab.py down
  extra:
    if: github.event_name == 'workflow_dispatch' && inputs.extra_database != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/dblab.py up ${{ inputs.extra_database }}
      - run: python tools/dblab.py verify ${{ inputs.extra_database }}
      - if: always()
        run: python tools/dblab.py logs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ inputs.extra_database }}
          path: reports/
          if-no-files-found: ignore
      - if: always()
        run: python tools/dblab.py down
