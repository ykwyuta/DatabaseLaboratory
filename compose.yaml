name: rava
services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: rava
      POSTGRES_PASSWORD: Rava_Test_2026!
      POSTGRES_DB: rava
    ports: ["127.0.0.1:${RAVA_POSTGRES_PORT:-35432}:5432"]
    volumes:
      - ./sql:/demo/sql:ro
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres.sql:/docker-entrypoint-initdb.d/10-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U rava -d rava -Atc 'SELECT dataset_version FROM demo_ready WHERE id=1' | grep -qx rava-v1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s
  mysql:
    profiles: [mysql]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: Rava_Test_2026!
      MYSQL_USER: rava
      MYSQL_PASSWORD: Rava_Test_2026!
      MYSQL_DATABASE: rava
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["127.0.0.1:${RAVA_MYSQL_PORT:-33306}:3306"]
    volumes:
      - ./sql:/demo/sql:ro
      - mysql_data:/var/lib/mysql
      - ./init/mysql.sql:/docker-entrypoint-initdb.d/10-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u rava -D rava -Nse 'SELECT dataset_version FROM demo_ready WHERE id=1' | grep -qx rava-v1"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 15s
  sqlserver:
    profiles: [sqlserver]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Rava_Test_2026!
      SQLCMDPASSWORD: Rava_Test_2026!
    entrypoint: ["/bin/bash", "/demo/sqlserver-start.sh"]
    ports: ["127.0.0.1:${RAVA_SQLSERVER_PORT:-31433}:1433"]
    volumes:
      - ./sql:/demo/sql:ro
      - sqlserver_data:/var/opt/mssql
      - ./docker/sqlserver-start.sh:/demo/sqlserver-start.sh:ro
      - ./init/sqlserver.sql:/demo/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/opt/mssql/rava-ready && /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -C -b -d rava -Q 'SELECT dataset_version FROM demo_ready WHERE id=1' -h -1 | grep -q rava-v1"]
      interval: 3s
      timeout: 5s
      retries: 80
      start_period: 10s
  oracle:
    profiles: [oracle]
    image: container-registry.oracle.com/database/free:latest-lite
    environment:
      ORACLE_PWD: Rava_Test_2026!
      ORACLE_CHARACTERSET: AL32UTF8
      NLS_LANG: .AL32UTF8
    shm_size: 1gb
    ports: ["127.0.0.1:${RAVA_ORACLE_PORT:-31521}:1521"]
    volumes:
      - ./sql:/demo/sql:ro
      - oracle_data:/opt/oracle/oradata
      - ./init/oracle.sql:/demo/init.sql:ro
      - ./docker/oracle-startup.sh:/opt/oracle/scripts/startup/10-demo.sh:ro
      - ./docker/oracle-health.sql:/demo/health.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "sqlplus -L -s 'rava/\"Rava_Test_2026!\"@//127.0.0.1:1521/FREEPDB1' @/demo/health.sql | grep -q rava-v1"]
      interval: 10s
      timeout: 10s
      retries: 90
      start_period: 30s
  db2:
    profiles: [db2]
    build:
      context: .
      dockerfile: docker/db2.Dockerfile
    privileged: true
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: Rava_Test_2026!
      DBNAME: RAVA
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      TO_CREATE_SAMPLEDB: "false"
      PERSISTENT_HOME: "true"
    ports: ["127.0.0.1:${RAVA_DB2_PORT:-35000}:50000"]
    volumes:
      - db2_data:/database
      - ./sql:/demo/sql:ro
    healthcheck:
      test: ["CMD", "/demo/db2-health.sh"]
      interval: 10s
      timeout: 15s
      retries: 90
      start_period: 40s
  mariadb:
    profiles: [mariadb]
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: Rava_Test_2026!
      MARIADB_DATABASE: rava
      MARIADB_USER: rava
      MARIADB_PASSWORD: Rava_Test_2026!
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["127.0.0.1:${RAVA_MARIADB_PORT:-33307}:3306"]
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init/mariadb.sql:/docker-entrypoint-initdb.d/10-demo.sql:ro
      - ./sql:/demo/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MARIADB_PASSWORD mariadb -h 127.0.0.1 -u rava -D rava -Nse 'SELECT dataset_version FROM demo_ready WHERE id=1' | grep -qx rava-v1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s
  mongo:
    profiles: [mongo]
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: rava
      MONGO_INITDB_ROOT_PASSWORD: Rava_Test_2026!
      MONGO_INITDB_DATABASE: rava
    ports: ["127.0.0.1:${RAVA_MONGO_PORT:-37017}:27017"]
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./init/mongo.js:/docker-entrypoint-initdb.d/10-demo.js:ro
      - ./docker/mongo-verify.js:/demo/verify.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "127.0.0.1", "-u", "rava", "-p", "Rava_Test_2026!", "--authenticationDatabase", "admin", "rava", "/demo/verify.js"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 10s
  redis:
    profiles: [redis]
    image: redis:7.4-alpine
    environment:
      REDISCLI_AUTH: Rava_Test_2026!
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "Rava_Test_2026!"]
    ports: ["127.0.0.1:${RAVA_REDIS_PORT:-36379}:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 3s
      timeout: 5s
      retries: 30
  clickhouse:
    profiles: [clickhouse]
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: rava
      CLICKHOUSE_USER: rava
      CLICKHOUSE_PASSWORD: Rava_Test_2026!
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${RAVA_CLICKHOUSE_HTTP_PORT:-38123}:8123"
      - "127.0.0.1:${RAVA_CLICKHOUSE_NATIVE_PORT:-39000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./init/clickhouse.sql:/docker-entrypoint-initdb.d/10-demo.sql:ro
      - ./sql/clickhouse-verify.sql:/demo/verify.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user rava --password \"$$CLICKHOUSE_PASSWORD\" --database rava --query \"SELECT dataset_version FROM demo_ready WHERE id=1\" | grep -qx rava-v1"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 10s
  alloydb-server:
    profiles: [alloydb]
    image: google/alloydbomni:17.9.0
    environment:
      POSTGRES_PASSWORD: Rava_Test_2026!
    shm_size: 1gb
    ports: ["127.0.0.1:${RAVA_ALLOYDB_PORT:-35433}:5432"]
    volumes:
      - alloydb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U postgres -d postgres -Atc 'SELECT 1' | grep -qx 1"]
      interval: 5s
      timeout: 10s
      retries: 90
      start_period: 30s
  alloydb:
    profiles: [alloydb]
    image: postgres:17-alpine
    depends_on:
      alloydb-server:
        condition: service_healthy
    environment:
      PGHOST: alloydb-server
      PGUSER: rava
      PGPASSWORD: Rava_Test_2026!
      PGDATABASE: rava
    entrypoint: ["/bin/sh", "/demo/alloydb-init.sh"]
    volumes:
      - ./docker/alloydb-init.sh:/demo/alloydb-init.sh:ro
      - ./init/alloydb.sql:/demo/init.sql:ro
      - ./sql:/demo/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -Atc 'SELECT dataset_version FROM demo_ready WHERE id=1' | grep -qx rava-v1"]
      interval: 5s
      timeout: 10s
      retries: 90
      start_period: 10s
  spanner-emulator:
    profiles: [spanner]
    image: gcr.io/cloud-spanner-emulator/emulator:1.5.41
    ports:
      - "127.0.0.1:${RAVA_SPANNER_GRPC_PORT:-39010}:9010"
      - "127.0.0.1:${RAVA_SPANNER_REST_PORT:-39020}:9020"
  spanner:
    profiles: [spanner]
    image: python:3.13-alpine
    depends_on:
      spanner-emulator:
        condition: service_started
    environment:
      SPANNER_REST_ENDPOINT: http://spanner-emulator:9020
    command: ["python", "-u", "/demo/spanner.py"]
    volumes:
      - ./docker/spanner.py:/demo/spanner.py:ro
    healthcheck:
      test: ["CMD", "python", "/demo/spanner.py", "--verify"]
      interval: 5s
      timeout: 15s
      retries: 90
      start_period: 10s
volumes:
  postgres_data:
  mysql_data:
  sqlserver_data:
  oracle_data:
  db2_data:
  mariadb_data:
  mongo_data:
  mongo_config:
  redis_data:
  clickhouse_data:
  alloydb_data:
